[package]
name = "saver-option-business"
version = "0.1.0"
description = "Saver Option Business for Mac"
edition = "2021"
publish = false

[lib]
name = "saver_option_business_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
url = "2"
# Used by the generated context (plugin configuration).
serde_json = "1"
