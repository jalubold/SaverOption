<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saver Option Business</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; text-align: center;
        background: radial-gradient(60% 50% at 50% 35%, rgb(124 58 236 / 0.18), transparent 70%), #0c0e12;
        color: #e7e9ee; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      .mark { display: block; width: 96px; height: 96px; margin: 0 auto -6px; -webkit-user-drag: none; }
      h1 { margin: 18px 0 4px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: #9aa0ac; }
      button {
        margin-top: 18px; padding: 9px 18px; border-radius: 10px; border: 1px solid rgb(255 255 255 / 0.18);
        background: linear-gradient(#7c3aec, #4803bd); color: #fff; font: 600 14px/1 inherit; cursor: pointer;
      }
      [hidden] { display: none; }
    </style>
  </head>
  <body data-tauri-drag-region="deep">
    <main>
      <!-- The app icon itself (src-tauri/icons), so the start page matches the Dock. -->
      <img class="mark" src="app-icon.png" alt="" width="96" height="96" />
      <h1>Saver Option Business</h1>
      <p id="status">Opening…</p>
      <button id="retry" type="button" hidden>Try again</button>
    </main>
    <script>
      // The app shows the live site; this page only covers the moment before it loads, or being offline.
      // It reopens the page you were on last (set by the app, checked again here).
      const resume = typeof window.__SO_RESUME__ === "string" ? window.__SO_RESUME__ : "";
      const HOME = "https://www.saveroption.com" + (/^\/business\/[\w\-/?=&%.]*$/.test(resume) ? resume : "/business/dashboard");
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      function open() {
        if (navigator.onLine) {
          status.textContent = "Opening…";
          retry.hidden = true;
          window.location.replace(HOME);
        } else {
          status.textContent = "You're offline. Saver Option Business needs an internet connection.";
          retry.hidden = false;
        }
      }
      retry.addEventListener("click", open);
      window.addEventListener("online", open);
      open();
    </script>
  </body>
</html>
